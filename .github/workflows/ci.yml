name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ← fixes the Node.js warning

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4.2.2        # ← updated

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0   # ← updated

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.4.0     # ← updated

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6.15.0     # ← updated to v6

        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: olamilekan139/diabetes_model:latest
